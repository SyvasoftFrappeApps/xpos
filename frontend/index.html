<!doctype html>
<html lang="{{ lang }}" dir="{{ layout_direction }}">
	<head>
		<meta charset="UTF-8" />
		<link rel="icon" href="/public/xpos-logo-light.svg" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
		<meta name="theme-color" content="#f97316" />
		<meta name="description" content="X POS - Modern Point of Sale with offline support" />
		<link rel="apple-touch-icon" href="./apple-touch-icon.svg" />
		<link rel="manifest" href="./manifest.webmanifest" />
		<title>{{ app_name }}</title>
		<script>
			(function () {
				const theme = localStorage.getItem("xpos-theme") || "system";
				let effectiveTheme = theme;

				if (theme === "system") {
					effectiveTheme = window.matchMedia("(prefers-color-scheme: dark)").matches
						? "dark"
						: "light";
				}

				const html = document.documentElement;
				if (effectiveTheme === "dark") {
					html.classList.add("dark");
					html.classList.remove("light");
				} else {
					html.classList.add("light");
					html.classList.remove("dark");
				}
			})();
		</script>
	</head>

	<body>
		<div id="app"></div>
		<script>
			window.xpos = window.xpos || {};
			window.xpos.boot = {{ boot | json }};
			window.xpos._messages = window.xpos.boot["__messages"];
			window.xpos.csrf_token = "{{ csrf_token }}";
		</script>
		<script type="module" src="/src/main.ts"></script>
	</body>
</html>
